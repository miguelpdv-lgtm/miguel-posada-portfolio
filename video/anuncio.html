<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Video anuncios — Pixel</title>
<style>
@font-face{font-family:'Archivo';font-weight:400 800;font-stretch:75% 110%;src:url(/fonts/archivo-latin.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400 600;src:url(/fonts/jetbrains-mono-latin.woff2) format('woff2')}
html,body{margin:0;background:#000}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ==========================================================
   Renderizador determinista de video anuncios.
   Cada video expone: W, H, DUR, SUBS (subtítulos + voz), SFX (efectos) y draw(t).
   window.renderFrame(t) dibuja el cuadro exacto del segundo t (para exportar a MP4).
   Abre ?v=a o ?v=b&play para verlo en tiempo real.
   ========================================================== */
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const C = { bg: '#0b0c09', panel: '#131410', panel2: '#1f2119', lime: '#cbff00', cream: '#f0ede6', dim: '#b3b0a8', violet: '#a78bfa', coral: '#ff6b4a', cyan: '#4fd8eb', dark: '#0b0c09' };
const PROJECTS = [
  { img: 'ema', name: 'EMA RIZOS', type: 'E-COMMERCE', dom: 'emarizos.co', c: '#e0689a' },
  { img: 'flylatam', name: 'FLYLATAM PLUS', type: 'AGENCIA DE VIAJES', dom: 'flylatamplus.com', c: '#ff9f1c' },
  { img: 'ami', name: 'AMICRESPA', type: 'SALÓN + TIENDA', dom: 'amicrespa.com', c: '#f2cf5b' },
  { img: 'ordenio', name: 'ORDENIO', type: 'SAAS', dom: 'ordenio.shop', c: '#ff5a2c' },
  { img: 'luminni', name: 'LUMINNI', type: 'E-COMMERCE EDITORIAL', dom: 'luminni.store', c: '#e8b27a' },
];

/* ---------- utilidades ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, p) => a + (b - a) * p;
const eCubic = p => 1 - Math.pow(1 - p, 3);
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const eBounce = p => {
  const n = 7.5625, d = 2.75;
  if (p < 1 / d) return n * p * p;
  if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
  if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375;
  return n * (p -= 2.625 / d) * p + .984375;
};
const fade = (t, a, b, d = .3) => Math.min(seg(t, a, a + d), 1 - seg(t, b - d, b));
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(s, x, y, o = {}) {
  const { size = 40, weight = 700, color = C.cream, align = 'left', mono = false, cond = false, ls = 0, alpha = 1, base = 'alphabetic' } = o;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${mono ? '"JetBrains Mono"' : 'Archivo'}`;
  ctx.fontStretch = cond ? 'condensed' : 'normal';
  ctx.letterSpacing = ls + 'px';
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillText(s, x, y);
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}
function wrap(s, maxW, font) {
  ctx.font = font; const out = []; let line = '';
  for (const w of s.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
  }
  if (line) out.push(line);
  return out;
}
function drawCover(img, x, y, w, h, top = true) {
  const s = Math.max(w / img.width, h / img.height);
  const sw = w / s, sh = h / s;
  const sx = (img.width - sw) / 2, sy = top ? 0 : (img.height - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
/* ventana de navegador con captura */
function browser(img, x, y, w, h, o = {}) {
  const { dom = '', glow = null, border = 'rgba(240,237,230,.28)', bar = 40 } = o;
  ctx.save();
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 90; }
  rr(x, y, w, h, 14); ctx.fillStyle = C.panel; ctx.fill();
  ctx.restore();
  ctx.save();
  rr(x, y, w, h, 14); ctx.clip();
  ctx.fillStyle = '#1b1c17'; ctx.fillRect(x, y, w, bar);
  ['#ff6b4a', '#ffc83d', C.lime].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 22 + i * 18, y + bar / 2, 6, 0, 7); ctx.fill(); });
  if (dom) {
    ctx.font = `600 ${bar * .42}px "JetBrains Mono"`; const tw = ctx.measureText(dom).width;
    rr(x + w / 2 - tw / 2 - 16, y + bar * .2, tw + 32, bar * .6, bar * .3); ctx.fillStyle = 'rgba(240,237,230,.07)'; ctx.fill();
    txt(dom, x + w / 2, y + bar / 2 + 1, { size: bar * .42, weight: 600, mono: true, color: C.dim, align: 'center', base: 'middle' });
  }
  if (img) drawCover(img, x, y + bar, w, h - bar);
  ctx.restore();
  rr(x, y, w, h, 14); ctx.lineWidth = 3; ctx.strokeStyle = border; ctx.stroke();
}

/* ---------- fondo ---------- */
function background(t, W, H) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const au = [[.85, .08, C.violet, .22], [.1, .95, C.coral, .14], [.08, .1, C.cyan, .08]];
  for (const [ax, ay, c, a] of au) {
    const x = ax * W + Math.sin(t * .4 + ax * 9) * W * .04, y = ay * H + Math.cos(t * .3 + ay * 7) * H * .03;
    const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(W, H) * .5);
    g.addColorStop(0, hexA(c, a)); g.addColorStop(1, hexA(c, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const cell = 60, off = (t * 14) % cell;
  ctx.strokeStyle = 'rgba(240,237,230,.045)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let x = -cell + off; x < W; x += cell) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -cell + off; y < H; y += cell) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function brandMark(x, y, size, align = 'center', alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = `700 ${size}px Archivo`; ctx.letterSpacing = (size * .14) + 'px';
  const tw = ctx.measureText('MIGUEL POSADA').width, lw = size * 1.9, gap = size * .5;
  const total = lw + gap + tw;
  const x0 = align === 'center' ? x - total / 2 : x;
  ctx.drawImage(IMG.logo, x0, y - lw * .5, lw, lw * IMG.logo.height / IMG.logo.width);
  txt('MIGUEL POSADA', x0 + lw + gap, y + size * .36, { size, weight: 700, ls: size * .14 });
  ctx.restore();
}

/* ---------- subtítulos ---------- */
function subtitles(t, V) {
  const s = V.SUBS.find(x => t >= x.a && t <= x.b); if (!s) return;
  const a = fade(t, s.a, s.b, .18);
  const size = V.subSize, font = `600 ${size}px Archivo`;
  const lines = wrap(s.text, V.subMax, font);
  const lh = size * 1.25, padY = size * .55, h = lines.length * lh + padY * 2;
  let w = 0; ctx.font = font; lines.forEach(l => w = Math.max(w, ctx.measureText(l).width));
  w += size * 1.6;
  const x = V.W / 2 - w / 2, y = V.subY - h / 2;
  ctx.save(); ctx.globalAlpha = a;
  rr(x, y, w, h, size * .45); ctx.fillStyle = 'rgba(0,0,0,.78)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = hexA(C.lime, .55); ctx.stroke();
  lines.forEach((l, i) => txt(l, V.W / 2, y + padY + lh * i + lh / 2 + 1, { size, weight: 600, align: 'center', base: 'middle' }));
  ctx.restore();
}

/* ---------- Pixel (la mascota, igual que en la web) ---------- */
function pixel(t, o) {
  const { x, y, s = 1, pose = 'idle', mood = 'happy', facing = 1, walk = 0, walking = false, jz = 0, squash = 1, look = 0 } = o;
  const shadowK = clamp(1 - jz / (180 * s), .35, 1);
  ctx.fillStyle = `rgba(0,0,0,${.45 * shadowK})`;
  ctx.beginPath(); ctx.ellipse(x, y + 6 * s, 58 * s * shadowK, 10 * s * shadowK, 0, 0, 7); ctx.fill();
  const bob = walking ? -Math.abs(Math.sin(walk)) * 6 : Math.sin(t * 3) * 3;
  ctx.save();
  ctx.translate(x, y - 20 * s - jz + bob * s);
  ctx.rotate(walking ? Math.sin(walk) * .05 : 0);
  ctx.scale(s * facing * (2 - squash), s * squash);
  ctx.strokeStyle = C.lime; ctx.fillStyle = C.lime; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let l1x = -24, l2x = 24, l1y = 12, l2y = 12;
  if (pose === 'fall') { const sw = Math.sin(t * 10) * 5; l1x = -30 + sw; l2x = 30 - sw; l1y = l2y = 24; }
  else if (walking) { l1y = 12 - Math.max(0, Math.sin(walk)) * 9; l2y = 12 - Math.max(0, -Math.sin(walk)) * 9; l1x = -24 + Math.cos(walk) * 7; l2x = 24 - Math.cos(walk) * 7; }
  ctx.beginPath(); ctx.moveTo(-24, -8); ctx.lineTo(l1x, l1y); ctx.moveTo(24, -8); ctx.lineTo(l2x, l2y); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(l1x - 4, l1y + 2, 12, 6, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(l2x + 4, l2y + 2, 12, 6, 0, 0, 7); ctx.fill();
  const sway = Math.sin(t * 2) * 2, sw = walking ? Math.sin(walk) * 7 : 0;
  let L = [[-92, -45], [-86, -24 + sway + sw]], R = [[92, -45], [86, -24 - sway - sw]];
  if (pose === 'wave') { const w = Math.sin(t * 9) * 14; R = [[95, -85], [92 + w, -118]]; }
  else if (pose === 'point') R = [[100, -66], [130, -80]];
  else if (pose === 'type') { const j = Math.sin(t * 22) * 4; L = [[-92, -38], [-40, -14 + j]]; R = [[92, -38], [40, -14 - j]]; }
  else if (pose === 'cheer' || pose === 'fall') { const f = Math.sin(t * 12) * 6; L = [[-100, -80], [-92 + f, -130]]; R = [[100, -80], [92 - f, -130]]; }
  ctx.beginPath();
  ctx.moveTo(-70, -60); ctx.quadraticCurveTo(L[0][0], L[0][1], L[1][0], L[1][1]);
  ctx.moveTo(70, -60); ctx.quadraticCurveTo(R[0][0], R[0][1], R[1][0], R[1][1]);
  ctx.stroke();
  rr(-72, -125, 144, 118, 20); ctx.fillStyle = C.panel; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = C.lime; ctx.stroke();
  ctx.fillStyle = C.panel2; rr(-69, -122, 138, 22, 17); ctx.fill();
  ['#ff6b5e', '#ffc93d', C.lime].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(-52 + i * 14, -111, 4.5, 0, 7); ctx.fill(); });
  rr(-58, -94, 116, 76, 12); ctx.fillStyle = C.lime; ctx.fill();
  const blink = (t % 3.1) < .12;
  ctx.fillStyle = C.dark; ctx.strokeStyle = C.dark; ctx.lineWidth = 4;
  for (const sd of [-1, 1]) {
    ctx.beginPath();
    if (blink && mood !== 'excited') { ctx.rect(sd * 22 - 9 + look * 4, -64, 18, 3); ctx.fill(); }
    else if (mood === 'excited') { ctx.moveTo(sd * 22 - 9, -58); ctx.lineTo(sd * 22, -68); ctx.lineTo(sd * 22 + 9, -58); ctx.stroke(); }
    else if (pose === 'fall') { ctx.arc(sd * 22, -63, 9, 0, 7); ctx.fill(); }
    else { ctx.ellipse(sd * 22 + look * 4, -62 + (mood === 'curious' ? -4 : 0), 8, 10, 0, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(255,120,150,.55)';
  ctx.beginPath(); ctx.ellipse(-40, -44, 7, 4, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(40, -44, 7, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = C.dark; ctx.strokeStyle = C.dark; ctx.lineWidth = 4; ctx.beginPath();
  if (pose === 'fall' || mood === 'curious') { ctx.ellipse(0, -38, 6, 7, 0, 0, 7); ctx.fill(); }
  else if (mood === 'excited') { ctx.arc(0, -46, 13, .1, Math.PI - .1); ctx.closePath(); ctx.fill(); }
  else { ctx.arc(0, -46, 10, .3, Math.PI - .3); ctx.stroke(); }
  if (pose === 'type') {
    rr(-54, -22, 108, 16, 5); ctx.fillStyle = C.panel2; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = C.lime; ctx.stroke();
    ctx.fillStyle = C.lime;
    for (let i = 0; i < 6; i++) if (Math.sin(t * 18 + i * 2.1) > .4) ctx.fillRect(-44 + i * 15, -17, 9, 5);
  }
  ctx.fillStyle = C.lime;
  for (const p of [L[1], R[1]]) { ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, 7); ctx.fill(); }
  ctx.restore();
}

/* ---------- confeti determinista ---------- */
let sd = 11; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
const CONF = Array.from({ length: 110 }, (_, i) => ({ a: -Math.PI / 2 + (rnd() - .5) * 2.4, v: 700 + rnd() * 1100, r: 6 + rnd() * 8, rot: rnd() * 6, vr: (rnd() - .5) * 14, c: [C.lime, C.cream, C.violet, C.coral, C.cyan][i % 5] }));
function confetti(t, t0, x, y, scale = 1) {
  const d = t - t0; if (d < 0 || d > 3.2) return;
  for (const c of CONF) {
    const px = x + Math.cos(c.a) * c.v * d * scale, py = y + Math.sin(c.a) * c.v * d * scale + 1500 * d * d * scale;
    ctx.save(); ctx.globalAlpha = clamp(1 - d / 3.2, 0, 1);
    ctx.translate(px, py); ctx.rotate(c.rot + c.vr * d);
    ctx.fillStyle = c.c; ctx.fillRect(-c.r * scale, -c.r * scale / 2, c.r * 2 * scale, c.r * scale);
    ctx.restore();
  }
}
function dust(t, t0, x, y, s) {
  const d = t - t0; if (d < 0 || d > .6) return;
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI, r = (20 + d * 160) * s * .5;
    ctx.fillStyle = `rgba(240,237,230,${(1 - d / .6) * .35})`;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * 1.6 * (i % 2 ? 1 : -1), y - Math.sin(a) * r * .35, (4 + d * 14) * s * .5, 0, 7); ctx.fill();
  }
}
function button(x, y, w, h, label, t, t0, color = C.lime, textColor = C.dark) {
  const p = eBack(seg(t, t0, t0 + .45)); if (p <= 0) return;
  const pulse = 1 + Math.sin((t - t0) * 5) * .025 * seg(t, t0 + .6, t0 + 1);
  ctx.save(); ctx.translate(x, y); ctx.scale(p * pulse, p * pulse);
  ctx.shadowColor = hexA(color, .5); ctx.shadowBlur = 40;
  rr(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = color; ctx.fill();
  ctx.shadowBlur = 0;
  txt(label, 0, 2, { size: h * .34, weight: 600, mono: true, color: textColor, align: 'center', base: 'middle', ls: h * .02 });
  ctx.restore();
}
/* titular por líneas que suben */
function headline(lines, x, y, size, t, t0, t1, o = {}) {
  const { color = C.lime, align = 'center', lh = .98 } = o;
  const out = seg(t, t1 - .3, t1);
  lines.forEach((l, i) => {
    const p = eCubic(seg(t, t0 + i * .1, t0 + i * .1 + .5));
    if (p <= 0) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, y + i * size * lh - size, 99999, size * 1.12); ctx.clip();
    txt(l, x, y + i * size * lh + (1 - p) * size * 1.1 - out * size * 1.1, { size, weight: 800, cond: true, color: Array.isArray(color) ? color[i] : color, align });
    ctx.restore();
  });
}
function icon(kind, x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  if (kind === 'search') { ctx.arc(-4, -4, 13, 0, 7); ctx.moveTo(6, 6); ctx.lineTo(17, 17); ctx.stroke(); }
  if (kind === 'phone') { rr(-12, -20, 24, 40, 6); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 13, 2.5, 0, 7); ctx.fill(); }
  if (kind === 'chat') { ctx.moveTo(-17, 15); ctx.lineTo(-13, 6); ctx.arc(0, -2, 17, 2.4, 2.4 + Math.PI * 1.75); ctx.closePath(); ctx.stroke(); ctx.beginPath(); for (const dx of [-7, 0, 7]) { ctx.moveTo(dx, -2); ctx.arc(dx, -2, 2, 0, 7); } ctx.fill(); }
  ctx.restore();
}

/* ==========================================================
   VIDEO A — vertical 9:16 (1080×1920), 24 s
   ========================================================== */
const A = {
  id: 'a', W: 1080, H: 1920, DUR: 24, subY: 1225, subSize: 44, subMax: 860,
  SUBS: [
    { a: .25, b: 3.15, text: '¿Tu negocio todavía no tiene página web?' },
    { a: 3.35, b: 8.5, text: 'Miguel diseña páginas modernas, rápidas y hechas a tu medida.' },
    { a: 8.7, b: 14.1, text: 'Tiendas online, reservas y catálogos que ya venden todos los días.' },
    { a: 14.3, b: 18.7, text: 'Optimizada para Google, perfecta en celular y conectada a WhatsApp.' },
    { a: 18.9, b: 23.7, text: 'Cotiza tu página hoy en miguelposada.dev', voice: 'Cotiza tu página hoy, en miguel posada punto dev.' },
  ],
  SFX: [
    ['whoosh', 0], ['land', .33], ['land_s', .66], ['swoosh', .15],
    ['whoosh', 3.2], ['type', 3.9, 2.1], ['pop', 4.0], ['pop', 4.35], ['pop', 4.7], ['pop', 5.05], ['pop', 5.4], ['pop', 5.75], ['shine', 6.05], ['ding', 6.8],
    ['whoosh', 8.8], ['whoosh', 9.85], ['whoosh', 10.9], ['whoosh', 11.95], ['whoosh', 13.0],
    ['pop', 14.55], ['pop', 15.25], ['pop', 15.95], ['boing', 16.7], ['boing', 17.5],
    ['whoosh', 18.8], ['confetti', 19.25], ['boing', 19.2], ['ding', 20.2],
  ],
  draw(t) {
    const W = 1080, H = 1920, GY = 1665;
    background(t, W, H);
    brandMark(W / 2, 130, 34);

    /* Pixel: trayectoria por escenas */
    let P = { x: 540, y: 1110, s: 2.3, pose: 'idle', mood: 'curious', facing: 1, jz: 0, squash: 1 };
    if (t < .9) { P.y = lerp(-420, 1110, eBounce(seg(t, 0, .9))); P.pose = 'fall'; }
    else if (t < 3.2) { P.squash = 1 - Math.max(0, .12 - (t - .9) * .5) * Math.sin((t - .9) * 30); }
    else if (t < 8.6) {
      const p = eInOut(seg(t, 3.2, 3.8));
      Object.assign(P, { x: 540, y: lerp(1110, GY, p), s: lerp(2.3, 1.55, p), pose: t > 3.8 ? 'type' : 'idle', mood: 'happy' });
    } else if (t < 14.2) {
      const p = eInOut(seg(t, 8.6, 9.1));
      Object.assign(P, { x: lerp(540, 860, p), y: GY, s: lerp(1.55, 1.45, p), pose: 'point', mood: 'excited', facing: -1, walking: p > 0 && p < 1, walk: t * 14 });
    } else if (t < 18.8) {
      const p = eInOut(seg(t, 14.2, 14.7));
      Object.assign(P, { x: lerp(860, 540, p), y: GY, s: lerp(1.45, 1.6, p), pose: 'cheer', mood: 'excited', walking: p > 0 && p < 1, walk: t * 14 });
      if (t > 14.7) P.jz = Math.abs(Math.sin((t - 14.7) * 4.2)) * 110 * seg(t, 14.7, 15);
    } else {
      const p = eInOut(seg(t, 18.8, 19.2));
      Object.assign(P, { x: 540, y: GY + 20, s: lerp(1.6, 1.8, p), pose: 'wave', mood: 'excited' });
      const d = t - 19.2; if (d > 0 && d < .7) P.jz = Math.sin(d / .7 * Math.PI) * 200;
    }

    /* Escena 1 — gancho */
    if (t < 3.3) {
      headline(['¿TU NEGOCIO', 'NO TIENE', 'PÁGINA WEB?'], W / 2, 420, 150, t, .15, 3.3);
      const qa = fade(t, 1.0, 3.2);
      if (qa > 0) txt('?', P.x + 250, 880 + Math.sin(t * 5) * 14, { size: 150, weight: 800, color: C.lime, alpha: qa, align: 'center' });
      dust(t, .33, 540, 1110, 2.3);
    }

    /* Escena 2 — construye la web */
    if (t > 3.2 && t < 8.7) {
      const a = fade(t, 3.2, 8.7);
      ctx.save(); ctx.globalAlpha = a;
      headline(['HECHA A', 'TU MEDIDA'], W / 2, 330, 120, t, 3.3, 8.7);
      const x = 130, y = 470, w = 820, h = 605;
      const e = eBack(seg(t, 3.4, 3.9));
      ctx.save(); ctx.translate(W / 2, y + h / 2); ctx.scale(e, e); ctx.translate(-W / 2, -(y + h / 2));
      browser(null, x, y, w, h, { dom: 'tu-negocio.com', glow: hexA(C.violet, .35) });
      const cx = x, cy = y + 40, cw = w, ch = h - 40;
      ctx.save(); rr(x, y, w, h, 14); ctx.clip();
      const blocks = [
        [30, 24, 760, 40, C.panel2], [30, 90, 440, 250, C.lime], [500, 90, 290, 250, '#2a2c22'],
        [30, 370, 380, 26, C.cream], [30, 410, 300, 22, C.dim], [30, 460, 180, 50, C.coral],
      ];
      blocks.forEach((b, i) => {
        const p = eBack(seg(t, 4.0 + i * .35, 4.4 + i * .35)); if (p <= 0) return;
        ctx.globalAlpha = a * Math.min(1, p);
        rr(cx + b[0] + (1 - p) * 80, cy + b[1], b[2], b[3], 8); ctx.fillStyle = b[4]; ctx.fill();
      });
      const hp = seg(t, 5.1, 5.4);
      if (hp > 0) { // montaña en el bloque lima
        ctx.globalAlpha = a * hp; ctx.fillStyle = C.dark;
        ctx.beginPath(); ctx.arc(cx + 130, cy + 160, 26, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx + 60, cy + 330); ctx.lineTo(cx + 210, cy + 200); ctx.lineTo(cx + 300, cy + 280); ctx.lineTo(cx + 360, cy + 230); ctx.lineTo(cx + 460, cy + 330); ctx.fill();
      }
      const ip = seg(t, 6.0, 6.5); // la web real aparece
      if (ip > 0) { ctx.globalAlpha = a * ip; drawCover(IMG.ratio, cx, cy, cw, ch); }
      ctx.restore();
      if (ip > 0) { ctx.globalAlpha = a * ip; browser(null, x, y, w, 40, { dom: 'ratio-cafe-baq.ordenio.shop', bar: 40 }); }
      ctx.restore();
      const bp = eBack(seg(t, 6.8, 7.2));
      if (bp > 0) {
        ctx.save(); ctx.translate(x + w - 40, y + 20); ctx.rotate(.06); ctx.scale(bp, bp);
        rr(-150, -36, 300, 72, 36); ctx.fillStyle = C.lime; ctx.fill();
        txt('CARGA EN 1 S', 0, 2, { size: 28, weight: 600, mono: true, color: C.dark, align: 'center', base: 'middle' });
        ctx.restore();
      }
      ctx.restore();
    }

    /* Escena 3 — proyectos reales */
    if (t > 8.6 && t < 14.3) {
      const a = fade(t, 8.6, 14.3);
      ctx.save(); ctx.globalAlpha = a;
      headline(['+5 SITIOS', 'EN PRODUCCIÓN'], W / 2, 320, 118, t, 8.7, 14.3);
      const T0 = 8.8, step = 1.05;
      const cur = clamp(Math.floor((t - T0) / step), 0, 4);
      for (let i = Math.max(0, cur - 1); i <= cur; i++) {
        const pr = PROJECTS[i], ti = T0 + i * step;
        const pin = eCubic(seg(t, ti, ti + .45));
        const pout = i < cur ? eCubic(seg(t, ti + step, ti + step + .45)) : 0;
        if (pin <= 0) continue;
        const cw = 880, ch = 470;
        const x = W / 2 + (1 - pin) * 1100 - pout * 140, y = 800 + pout * 30;
        const rot = lerp(.18, i % 2 ? .03 : -.03, pin) - pout * .05, sc = 1 - pout * .12;
        ctx.save(); ctx.globalAlpha = a * (1 - pout * .75);
        ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
        browser(IMG[pr.img], -cw / 2, -ch / 2, cw, ch, { dom: pr.dom, glow: hexA(pr.c, .55), border: hexA(pr.c, .9) });
        ctx.restore();
      }
      const pr = PROJECTS[cur], la = seg(t, T0 + cur * step + .15, T0 + cur * step + .45);
      ctx.save(); ctx.globalAlpha = a * la;
      txt(`${pr.name} · ${pr.type}`, W / 2, 1115, { size: 36, weight: 600, mono: true, color: pr.c, align: 'center', ls: 2 });
      ctx.restore();
      ctx.restore();
    }

    /* Escena 4 — beneficios */
    if (t > 14.2 && t < 18.9) {
      const a = fade(t, 14.2, 18.9);
      ctx.save(); ctx.globalAlpha = a;
      headline(['LISTA PARA', 'VENDER'], W / 2, 320, 130, t, 14.3, 18.9);
      const feats = [['search', 'Optimizada para Google', C.lime], ['phone', 'Perfecta en celular', C.cyan], ['chat', 'Pagos y WhatsApp integrados', C.violet]];
      feats.forEach(([ic, label, col], i) => {
        const p = eBack(seg(t, 14.55 + i * .7, 15.0 + i * .7)); if (p <= 0) return;
        const y = 600 + i * 190;
        ctx.save(); ctx.globalAlpha = a * Math.min(1, p);
        ctx.translate(W / 2, y + 70); ctx.scale(.8 + .2 * p, .8 + .2 * p); ctx.translate(-W / 2, -(y + 70));
        rr(110, y, 860, 140, 30); ctx.fillStyle = 'rgba(19,20,16,.92)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = hexA(col, .6); ctx.stroke();
        rr(140, y + 25, 90, 90, 22); ctx.fillStyle = hexA(col, .14); ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
        icon(ic, 185, y + 70, 1.35, col);
        txt(label, 262, y + 83, { size: 41, weight: 700, color: C.cream });
        txt('✓', 920, y + 88, { size: 50, weight: 800, color: col, align: 'center' });
        ctx.restore();
      });
      ctx.restore();
    }

    /* Escena 5 — llamado a la acción */
    if (t > 18.8) {
      const a = seg(t, 18.8, 19.1);
      ctx.save(); ctx.globalAlpha = a;
      const p = eBack(seg(t, 18.9, 19.5));
      ctx.save(); ctx.translate(W / 2, 560); ctx.scale(p, p);
      txt('miguelposada', 0, -40, { size: 132, weight: 800, cond: true, color: C.cream, align: 'center' });
      txt('.dev', 0, 90, { size: 132, weight: 800, cond: true, color: C.lime, align: 'center' });
      ctx.restore();
      const u = eCubic(seg(t, 19.5, 20.1));
      ctx.fillStyle = C.lime; ctx.fillRect(W / 2 - 230 * u, 690, 460 * u, 8);
      const ia = seg(t, 19.7, 20.1);
      txt('Diseño y desarrollo web', W / 2, 790, { size: 42, weight: 600, color: C.cream, align: 'center', alpha: ia });
      txt('100% en línea · Toda Colombia', W / 2, 850, { size: 36, weight: 500, color: C.dim, align: 'center', alpha: ia });
      button(W / 2, 990, 700, 120, 'COTIZA POR WHATSAPP', t, 20.2);
      ctx.restore();
    }

    pixel(t, { ...P, walking: !!P.walking, walk: P.walk || 0 });
    if (t > 19.2) confetti(t, 19.25, 540, 1380, 1);
    subtitles(t, A);
  },
};

/* ==========================================================
   VIDEO B — horizontal 16:9 (1920×1080), 16 s
   ========================================================== */
const B = {
  id: 'b', W: 1920, H: 1080, DUR: 17, subY: 995, subSize: 40, subMax: 1500,
  // Tiempos reales del video. La escena 1 dura 3.8 s (antes 2.8) para que el saludo completo quepa sin prisa.
  SUBS: [
    { a: .2, b: 3.72, text: '¡Hola! Soy Pixel, el asistente de Miguel Posada.' },
    { a: 3.82, b: 7.8, text: 'Mira algunas páginas que ya hizo para negocios en Colombia.' },
    { a: 7.95, b: 11.9, text: 'Tiendas online, reservas, catálogos y mucho más.' },
    { a: 12.1, b: 16.8, text: '¿La tuya es la siguiente? Cotiza en miguelposada.dev', voice: '¿La tuya es la siguiente? Cotiza en miguel posada punto dev.' },
  ],
  SFX: [
    ['step', .2], ['step', .61], ['step', 1.02], ['step', 1.43], ['step', 1.83], ['pop', 2.1], ['swoosh', 2.31],
    ['whoosh', 3.8], ['whoosh', 5.4], ['whoosh', 7.0], ['whoosh', 8.6], ['whoosh', 10.2],
    ['whoosh', 12.0], ['boing', 12.5], ['confetti', 12.6], ['ding', 13.6],
  ],
  draw(T) {
    // la animación se diseñó con la escena 1 en 2.8 s: se estira a 3.8 s y el resto se corre 1 s
    const t = T < 3.8 ? T * 2.8 / 3.8 : T - 1;
    const W = 1920, H = 1080, GY = 890;
    background(t, W, H);
    brandMark(80, 78, 26, 'left');

    let P = { x: 420, y: GY, s: 1.55, pose: 'wave', mood: 'happy', facing: 1, jz: 0 };
    if (t < 1.5) { const p = seg(t, 0, 1.5); Object.assign(P, { x: lerp(-220, 420, p), pose: 'idle', walking: true, walk: t * 13 }); }
    else if (t < 2.7) { P.pose = 'wave'; P.mood = 'excited'; }
    else if (t < 11) {
      const p = eInOut(seg(t, 2.7, 3.1));
      Object.assign(P, { x: lerp(420, 620, p), pose: 'point', mood: 'excited', walking: p > 0 && p < 1, walk: t * 13 });
    } else {
      const p = eInOut(seg(t, 11, 11.4));
      Object.assign(P, { x: lerp(620, 420, p), pose: 'cheer', mood: 'excited', walking: p > 0 && p < 1, walk: t * 13 });
      const d = t - 11.45; if (d > 0 && d < .75) P.jz = Math.sin(d / .75 * Math.PI) * 180;
    }
    // línea de suelo
    ctx.strokeStyle = 'rgba(240,237,230,.14)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, GY + 8); ctx.lineTo(W, GY + 8); ctx.stroke();

    /* Escena 1 — presentación */
    if (t < 2.8) {
      headline(['HOLA,', 'SOY PIXEL.'], 800, 420, 150, t, .6, 2.8, { align: 'left' });
      const s = seg(t, 1.1, 1.5) * (1 - seg(t, 2.5, 2.8));
      txt('El asistente de Miguel Posada', 806, 610, { size: 48, weight: 600, color: C.cream, alpha: s });
      dust(t, 1.5, 420, GY, 1.5);
    }

    /* Escena 2 — recorrido por proyectos */
    if (t > 2.7 && t < 11.1) {
      const a = fade(t, 2.7, 11.1);
      ctx.save(); ctx.globalAlpha = a;
      const T0 = 2.8, step = 1.6;
      const i = clamp(Math.floor((t - T0) / step), 0, 4), pr = PROJECTS[i], ti = T0 + i * step;
      // brillo de marca
      const g = ctx.createRadialGradient(1300, 480, 0, 1300, 480, 900);
      g.addColorStop(0, hexA(pr.c, .22 * seg(t, ti, ti + .3))); g.addColorStop(1, hexA(pr.c, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const e = eBack(seg(t, 2.8, 3.3));
      const fx = 820, fy = 160, fw = 1000, fh = 600;
      ctx.save(); ctx.translate(fx + fw / 2, fy + fh / 2); ctx.scale(e, e); ctx.translate(-(fx + fw / 2), -(fy + fh / 2));
      browser(IMG[pr.img], fx, fy, fw, fh, { dom: pr.dom, glow: hexA(pr.c, .5), border: hexA(pr.c, .9), bar: 46 });
      // cortina de color al cambiar
      const cin = seg(t, ti, ti + .32);
      if (i > 0 && cin < 1) {
        ctx.save(); rr(fx, fy + 46, fw, fh - 46, 0); ctx.clip();
        ctx.fillStyle = pr.c; ctx.fillRect(fx + fw * eCubic(cin), fy + 46, fw, fh - 46); ctx.restore();
      }
      ctx.restore();
      // texto del proyecto
      const tp = eCubic(seg(t, ti + .1, ti + .5));
      ctx.save(); ctx.globalAlpha = a * tp;
      const dx = (1 - tp) * -40;
      rr(110 + dx, 250, 108, 46, 6); ctx.strokeStyle = pr.c; ctx.lineWidth = 3; ctx.stroke();
      txt(`P/0${i + 1}`, 164 + dx, 274, { size: 24, weight: 600, mono: true, color: pr.c, align: 'center', base: 'middle' });
      txt(pr.name, 106 + dx, 400, { size: 104, weight: 800, cond: true, color: C.cream });
      txt(pr.type, 110 + dx, 460, { size: 32, weight: 600, mono: true, color: pr.c, ls: 3 });
      ctx.restore();
      // puntos de progreso
      PROJECTS.forEach((p, k) => { ctx.fillStyle = k === i ? p.c : 'rgba(240,237,230,.25)'; ctx.beginPath(); ctx.arc(1320 - 60 + k * 30, 800, k === i ? 8 : 6, 0, 7); ctx.fill(); });
      ctx.restore();
    }

    /* Escena 3 — llamado a la acción */
    if (t > 11) {
      const a = seg(t, 11, 11.3);
      ctx.save(); ctx.globalAlpha = a;
      headline(['¿LA TUYA ES', 'LA SIGUIENTE?'], 1210, 300, 128, t, 11.05, 99);
      const p = eBack(seg(t, 11.8, 12.3));
      ctx.save(); ctx.translate(1210, 560); ctx.scale(p, p);
      const w1 = txt('miguelposada', 0, 0, { size: 96, weight: 800, cond: true, color: C.cream, align: 'center', alpha: 0 });
      const w2 = txt('.dev', 0, 0, { size: 96, weight: 800, cond: true, color: C.lime, alpha: 0 });
      txt('miguelposada', -(w1 + w2) / 2, 0, { size: 96, weight: 800, cond: true, color: C.cream });
      txt('.dev', -(w1 + w2) / 2 + w1, 0, { size: 96, weight: 800, cond: true, color: C.lime });
      ctx.restore();
      txt('100% en línea · Toda Colombia', 1210, 640, { size: 34, weight: 500, color: C.dim, align: 'center', alpha: seg(t, 12.2, 12.6) });
      button(1210, 760, 640, 110, 'COTIZA POR WHATSAPP', t, 12.6);
      ctx.restore();
    }

    pixel(t, { ...P, walking: !!P.walking, walk: P.walk || 0 });
    if (t > 11.6) confetti(t, 11.6, 420, 640, .85);
    subtitles(T, B);
  },
};

/* ---------- carga y API ---------- */
const VIDEOS = { a: A, b: B };
const V = VIDEOS[Q.get('v') || 'a'];
cv.width = V.W; cv.height = V.H;
const IMG = {};
const load = (k, src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = rej; i.src = src; });
window.READY = Promise.all([
  ...PROJECTS.map(p => load(p.img, `/assets/${p.img}.webp`)),
  load('ratio', '/assets/ratio.webp'), load('logo', '/assets/logo-mark.png'),
  document.fonts.load('800 100px Archivo'), document.fonts.load('600 40px "JetBrains Mono"'),
]).then(() => document.fonts.ready).then(() => true);
window.META = { W: V.W, H: V.H, DUR: V.DUR, SUBS: V.SUBS, SFX: V.SFX };
window.renderFrame = t => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; V.draw(t); };
window.frameJPEG = t => { window.renderFrame(t); return cv.toDataURL('image/jpeg', .93); };
if (Q.has('play')) READY.then(() => { const s = performance.now(); const f = () => { renderFrame(((performance.now() - s) / 1000) % V.DUR); requestAnimationFrame(f); }; f(); });
else READY.then(() => renderFrame(+(Q.get('t') || 0)));
</script>
